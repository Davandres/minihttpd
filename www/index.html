<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniHTTPd </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> MiniHTTPd </h1>
        <p> HTTP/1.1 está funcionando correctamente!</p>
        <div class="info">
            <h2>Características implementadas:</h2>
            <ul>
                <li> Servidor HTTP/1.1 básico</li>
                <li> Manejo de múltiples clientes con epoll</li>
                <li> Conexiones persistentes (Keep-Alive)</li>
                <li> Tipos MIME</li>
                <li> Protección contra Directory Traversal</li>
                <li> Método GET</li>
            </ul>
        </div>
    </div>
</body>
</html>
